name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope; CI only reads repo contents.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # Same test suite again, this time with TEST_DATABASE_URL set so the
  # store integration tests (internal/store/postgres_test.go) run too
  # instead of skipping.
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorolens
          POSTGRES_PASSWORD: sorolens
          POSTGRES_DB: sorolens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorolens"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test (with Postgres integration tests)
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://sorolens:sorolens@localhost:5432/sorolens?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@v5
        with:
          version: v3.15.0
      - name: Helm lint (standalone mode)
        run: helm lint deploy/helm/sorolens --set database.url=postgres://user:pass@host:5432/sorolens
      - name: Helm lint (upstream mode)
        run: |
          helm lint deploy/helm/sorolens \
            --set config.sourceMode=sorotrail \
            --set config.sorotrailUrl=http://sorotrail:8080
      - name: Helm lint (invalid value — schema must reject)
        run: |
          if helm lint deploy/helm/sorolens --set database.url=postgres://user:pass@host:5432/sorolens --set replicaCount=not-a-number; then
            echo "::error::Schema validation did not reject invalid replicaCount"
            exit 1
          fi
      - name: Helm lint (unknown value — schema must reject)
        run: |
          if helm lint deploy/helm/sorolens --set database.url=postgres://user:pass@host:5432/sorolens --set replicaCont=2; then
            echo "::error::Schema validation did not reject unknown value replicaCont"
            exit 1
          fi
      - name: Helm template render (standalone mode)
        run: helm template sorolens deploy/helm/sorolens --set database.url=postgres://user:pass@host:5432/sorolens > /dev/null
      - name: Helm template render (upstream mode)
        run: |
          helm template sorolens deploy/helm/sorolens \
            --set config.sourceMode=sorotrail \
            --set config.sorotrailUrl=http://sorotrail:8080 \
            > /dev/null
      - name: Helm chart golden tests
        env:
          SOROLENS_REQUIRE_HELM: "1"
        run: go test ./deploy/helm/sorolens/... -count=1
