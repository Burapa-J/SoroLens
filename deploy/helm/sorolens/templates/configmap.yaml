apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sorolens.fullname" . }}-config
  labels:
    {{- include "sorolens.labels" . | nindent 4 }}
data:
  SOURCE_MODE: {{ .Values.config.sourceMode | default "rpc" | quote }}
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if .Values.config.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  {{- end }}
  {{- if eq (.Values.config.sourceMode | default "rpc") "sorotrail" }}
  SOROTRAIL_URL: {{ required "config.sorotrailUrl is required when config.sourceMode is sorotrail" .Values.config.sorotrailUrl | quote }}
  {{- else }}
  {{- if .Values.config.network }}
  NETWORK: {{ .Values.config.network | quote }}
  {{- end }}
  {{- if .Values.config.rpcUrl }}
  RPC_URL: {{ .Values.config.rpcUrl | quote }}
  {{- end }}
  {{- if .Values.config.networkPassphrase }}
  NETWORK_PASSPHRASE: {{ .Values.config.networkPassphrase | quote }}
  {{- end }}
  POLL_INTERVAL: {{ .Values.config.pollInterval | quote }}
  {{- if .Values.config.retentionLedgers }}
  RETENTION_LEDGERS: {{ .Values.config.retentionLedgers | quote }}
  {{- end }}
  {{- if .Values.config.watchedContracts }}
  WATCHED_CONTRACTS: {{ .Values.config.watchedContracts | quote }}
  {{- end }}
  {{- if .Values.config.startLedger }}
  START_LEDGER: {{ .Values.config.startLedger | quote }}
  {{- end }}
  {{- end }}
