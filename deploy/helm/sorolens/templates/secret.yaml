{{- if and (ne (.Values.config.sourceMode | default "rpc") "sorotrail") (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sorolens.fullname" . }}-db
  labels:
    {{- include "sorolens.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url is required in standalone (rpc) mode when database.existingSecret is not set" .Values.database.url | quote }}
{{- end }}
