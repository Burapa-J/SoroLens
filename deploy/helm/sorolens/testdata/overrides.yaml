# Representative override set for the golden render tests: every value
# here switches a different template branch — resources, an existing
# database Secret, a ServiceMonitor, a PodDisruptionBudget, a custom
# ServiceAccount name, and pod annotations.
replicaCount: 2

serviceAccount:
  create: true
  name: sorolens-runner

podAnnotations:
  prometheus.io/scrape: "true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

pdb:
  enabled: true
  minAvailable: 1

database:
  existingSecret: existing-db-secret
  existingSecretKey: DATABASE_URL

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics
  additionalLabels:
    release: prometheus

config:
  sourceMode: "rpc"
  network: "mainnet"
  rpcUrl: "https://soroban-mainnet.example.com"
  pollInterval: "10s"
  watchedContracts: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
  startLedger: "1000"
  retentionLedgers: "34560"
  logLevel: "warn"
  corsAllowedOrigins: "https://app.example.com"
