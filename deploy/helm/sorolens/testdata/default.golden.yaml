# Source: sorolens/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sorolens
  labels:
    helm.sh/chart: sorolens-0.1.0
    app.kubernetes.io/name: sorolens
    app.kubernetes.io/instance: sorolens
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sorolens
      app.kubernetes.io/instance: sorolens
  template:
    metadata:
      annotations:
        checksum/config: 77b9604c7b1946cc8cebf73244a087c01c18034fe459c6ec448bd09034cb73b2
        checksum/secret: bb0ee68c7a56a41bbc77246508ec648db605391bb9470977baaede52e8857232
      labels:
        app.kubernetes.io/name: sorolens
        app.kubernetes.io/instance: sorolens
    spec:
      serviceAccountName: sorolens
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sorolens
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: "ghcr.io/sorotrail/sorolens:0.1.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sorolens-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sorolens-db
                  key: DATABASE_URL
          # Startup probe gives the process up to 30s to connect to Postgres,
          # run migrations (in standalone mode), and bind the HTTP listener.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 15
          # Liveness probe restarts the container if the HTTP listener deadlocks.
          # Targets /livez (matches Dockerfile HEALTHCHECK).
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe removes the pod from the Service if Postgres / RPC
          # (standalone mode) or the upstream SoroTrail API (sorotrail mode) is
          # unreachable, so traffic only hits healthy instances.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
